name: Test and build Windows app

on:
  push:
    branches: ["**"]
  pull_request:
  release:
    types: [published]  # publishing a release on GitHub attaches the zip to it
  workflow_dispatch:

permissions:
  contents: write  # attach the zip to releases

jobs:
  test:
    name: Tests (with LibreOffice for .xls files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
      - name: Install Python packages
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest -v

  windows:
    name: Build CertificateExcelBuilder.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Build the .exe
        run: python tools/build_exe.py
      - name: Check that the .exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CertificateExcelBuilder.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The app did not start correctly (exit code $($p.ExitCode))" }
      - name: Make the download zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\CertificateExcelBuilder | Out-Null
          Copy-Item dist\CertificateExcelBuilder.exe dist\CertificateExcelBuilder\
          Copy-Item "packaging\How to use.txt" dist\CertificateExcelBuilder\
          Compress-Archive -Path dist\CertificateExcelBuilder -DestinationPath dist\CertificateExcelBuilder.zip -Force
      - uses: actions/upload-artifact@v4
        with:
          name: CertificateExcelBuilder-windows
          path: dist/CertificateExcelBuilder/
          if-no-files-found: error
      - name: Attach the zip to the release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CertificateExcelBuilder.zip
          append_body: true
          body: |
            **Download `CertificateExcelBuilder.zip` below**, extract it, and double-click `CertificateExcelBuilder.exe`.
            Nothing to install.

            If Windows says "Windows protected your PC", click **More info → Run anyway**.
