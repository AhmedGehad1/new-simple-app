name: Test and build Windows app

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write  # attach the .exe to releases

jobs:
  test:
    name: Tests (with LibreOffice)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice Calc
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libreoffice-calc
      - name: Install Python packages
        run: pip install -r requirements.txt pytest openpyxl
      - name: Run tests
        run: python -m pytest -v

  windows:
    name: Build CertificatePDFBuilder.exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python packages
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -v
      - name: Build the .exe
        run: python tools/build_exe.py
      - name: Check that the .exe starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\CertificatePDFBuilder.exe -ArgumentList "--smoke-test" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "The app did not start correctly (exit code $($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        with:
          name: CertificatePDFBuilder-windows
          path: dist/CertificatePDFBuilder.exe
          if-no-files-found: error
      - name: Attach the .exe to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/CertificatePDFBuilder.exe

  windows-libreoffice:
    # Slow (installs LibreOffice), so it only runs for releases or when started by hand.
    name: End-to-end test on Windows with LibreOffice
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install LibreOffice
        run: choco install libreoffice-fresh -y --no-progress
      - name: Install Python packages
        run: pip install -r requirements.txt pytest openpyxl
      - name: Run tests
        run: python -m pytest -v tests/test_builder.py
